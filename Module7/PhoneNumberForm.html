<!--
The issue with the original form was that the validation was not strict enough.
It was not clearly checking the full phone number format, so some bad entries could slip through.

I fixed it by using a clean pattern that requires exactly 3 digits, a hyphen, 3 more digits, another hyphen,
then 4 digits. That matches the format 123-456-7890.
The form also tells the user what to enter and makes the field required.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phone Number Form</title>
</head>
<body>
    <form>
        <label for="phone">Enter your phone number in the format 123-456-7890</label>
        <input
            id="phone"
            type="tel"
            name="phone"
            pattern="^\d{3}-\d{3}-\d{4}$"
            placeholder="123-456-7890"
            title="Please enter a phone number in the format 123-456-7890"
            required>
        <br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
